appId: br.com.burrolandia.desktop
productName: Burrolândia
copyright: Copyright © 2026 Daniel Lemos
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Burrolândia
  artifactName: Burrolandia-Instalador-${version}.${ext}
portable:
  artifactName: Burrolandia-Portatil-${version}.${ext}
linux:
  icon: build/icon.png
  category: Office
  target: [AppImage]
  artifactName: Burrolandia-${version}.${ext}
